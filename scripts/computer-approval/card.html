<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Use 应用访问批准</title><!--CARD_STYLE--><style>.approval-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.approval-app{font-weight:650}.approval-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.72fr);gap:9px}.approval-actions .ds-button{width:100%}@media(max-width:480px){.approval-actions{grid-template-columns:1fr}}</style></head>
<body><main class="ds-page"><section class="ds-card" aria-labelledby="approval-title"><header class="ds-header"><div class="approval-heading"><p class="ds-eyebrow">DevSpace / Computer Use</p><span id="risk" class="ds-badge" data-tone="warning">Risk pending</span></div><h1 id="approval-title" class="ds-title">应用访问批准</h1><p id="id" class="ds-subtitle ds-mono">正在取得批准编号…</p></header><div class="ds-body"><dl class="ds-facts"><div class="ds-fact"><dt>应用</dt><dd id="app" class="approval-app">—</dd></div><div class="ds-fact"><dt>请求操作</dt><dd id="message">正在加载请求…</dd></div><div class="ds-fact"><dt>范围</dt><dd id="scope" class="ds-mono">当前工作区 · 当前 OAuth 客户端 · 当前应用</dd></div><div class="ds-fact"><dt>持续时间</dt><dd>批准卡最长 5 分钟；允许后的内存会话最长 15 分钟</dd></div></dl><div class="ds-risk">此操作可让 Computer Use 控制指定应用。仅在你确认应用与操作范围都正确时允许；拒绝不会继续原操作。</div><div class="approval-actions"><button id="allow" class="ds-button ds-button-primary" disabled>允许本次会话访问</button><button id="deny" class="ds-button ds-button-danger" disabled>拒绝</button></div><p id="status" class="ds-status" role="status" aria-live="polite">正在加载批准请求…</p><p class="ds-note">不会写入 Windows 权限、工作区权限或长期凭据；服务重启后批准失效。</p><details class="ds-details"><summary>查看回执（不含凭据）</summary><pre id="receipt" class="ds-code"></pre></details></div></section></main><!--CARD_SCRIPT--></body></html>
