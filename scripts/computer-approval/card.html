<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Use 应用访问批准</title>
<style>body{font:15px/1.55 system-ui,sans-serif;margin:0;color:#172033;background:#f8fafc}main{padding:24px;max-width:720px;margin:auto}h2{margin:0 0 8px;font-size:22px}#app{font-weight:650}#id{font:12px/1.5 ui-monospace,monospace;color:#5d6879}.buttons{display:flex;gap:10px;margin:20px 0}button{font:inherit;padding:11px 18px;border:1px solid #bcc6d2;border-radius:8px;cursor:pointer}#allow{background:#1f5f78;color:#fff}#deny{background:#fff;color:#29364a}button:disabled{opacity:.5;cursor:default}#status{padding:12px;background:#edf2f7;border-radius:8px}.note{font-size:13px;color:#5d6879}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin-top:16px}</style></head>
<body><main><h2>Computer Use 应用访问批准</h2><p id="id">正在取得批准编号…</p><p>Codex Computer Use 请求访问：<span id="app">—</span></p><p id="message"></p><p class="note">本次批准请求最长保留 5 分钟。允许后仅对当前 OAuth 客户端、当前工作区和此应用建立短时内存会话（最长 15 分钟）。不会写入 Windows 权限、工作区权限或长期凭据；服务重启后失效。</p><div class="buttons"><button id="allow" disabled>允许本次会话访问</button><button id="deny" disabled>拒绝</button></div><p id="status">正在加载批准请求…</p><details><summary>查看回执（不含凭据）</summary><pre id="receipt"></pre></details></main><!--CARD_SCRIPT--></body></html>
