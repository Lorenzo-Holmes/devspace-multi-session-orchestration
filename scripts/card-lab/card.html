<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>隔离卡片诊断</title><style>
body{margin:0;background:#f8fafc;color:#172235;font:16px/1.6 system-ui,sans-serif}.card{margin:16px;padding:24px;border:1px solid #cad5e2;border-radius:16px;background:white}h2{margin:0 0 8px;font-size:22px}p{margin:8px 0}.note{color:#506176;font-size:14px}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}button{padding:12px 22px;background:#153f62;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}button:last-child{background:#e8eef4;color:#26374b}button:disabled{opacity:.5;cursor:default}#status{padding:12px;border-radius:8px;background:#eef3f7;margin-top:16px}#status.error{background:#fff0ee;color:#9b2626}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}#identity{overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer}
</style></head><body><section class="card"><h2>卡片通道诊断 · V2</h2><p id="identity" class="note">等待测试编号</p><p id="choice-prompt">请选择一个测试标记。</p><p class="note">不是权限申请，不创建目标，不执行命令，也不发送聊天消息。</p><div id="choices" class="buttons"></div><p id="status" role="status" aria-live="polite">正在连接诊断宿主…</p><p id="sync-note" class="note"></p><details><summary>查看诊断时间线（不含凭据）</summary><pre id="timing"></pre></details><p class="note">答案被记录，不等于网页模型已恢复。这里只验证卡片的显示与返回通道。</p></section><!--CARD_SCRIPT--></body></html>
